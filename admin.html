<script>
const SUPABASE_URL =
"https://wxqstcpjlzqdsgmovkey.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NclT-va4nSEGCTUfUnVe3A_eizbM8vt";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let currentUser = null;
let otherSocial = [];


/* =========================
   HELPERS
========================= */

function $(id){
  return document.getElementById(id);
}

function show(id){
  $(id).classList.remove("hidden");
}

function hide(id){
  $(id).classList.add("hidden");
}

function status(id,message){
  $(id).textContent = message;
}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdmin(){

  const {
    data:{user}
  } = await supabaseClient.auth.getUser();

  if(!user){
    show("loginBox");
    hide("adminPanel");
    return;
  }

  const {data,error} =
    await supabaseClient
      .from("admins")
      .select("user_id")
      .eq("user_id",user.id)
      .maybeSingle();

  if(error || !data){

    await supabaseClient.auth.signOut();

    show("loginBox");
    hide("adminPanel");

    status(
      "loginStatus",
      "This account is not authorized as an admin."
    );

    return;
  }

  currentUser = user;

  hide("loginBox");
  show("adminPanel");

  await loadEverything();
}


/* =========================
   LOGIN
========================= */

$("loginBtn").onclick = async ()=>{

  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    status(
      "loginStatus",
      "Please enter your email and password."
    );
    return;
  }

  status(
    "loginStatus",
    "Logging in..."
  );

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    status(
      "loginStatus",
      error.message
    );

    return;
  }

  status(
    "loginStatus",
    "Login successful."
  );

  await checkAdmin();
};


/* =========================
   LOGOUT
========================= */

$("logoutBtn").onclick = async ()=>{
  await supabaseClient.auth.signOut();

  currentUser = null;

  hide("adminPanel");
  show("loginBox");

  status(
    "loginStatus",
    "Logged out."
  );
};


/* =========================
   FILE UPLOAD
========================= */

async function uploadFile(file,folder){

  if(!file) return null;

  const extension =
    file.name.split(".").pop();

  const fileName =
    folder + "/" +
    crypto.randomUUID() +
    "." +
    extension;

  const {error} =
    await supabaseClient
      .storage
      .from("site-assets")
      .upload(fileName,file,{
        upsert:false
      });

  if(error){
    throw error;
  }

  const {data} =
    supabaseClient
      .storage
      .from("site-assets")
      .getPublicUrl(fileName);

  return data.publicUrl;
}


/* =========================
   LOAD SETTINGS
========================= */

async function loadSettings(){

  const {data,error} =
    await supabaseClient
      .from("site_settings")
      .select("*")
      .limit(1)
      .maybeSingle();

  if(error){
    console.error(error);
    return;
  }

  if(!data) return;

  $("siteName").value =
    data.site_name || "";

  $("heroIntro").value =
    data.hero_intro || "";

  $("aboutText").value =
    data.about_text || "";

  $("whatsappNumber").value =
    data.whatsapp_number || data.whatsapp || "";

  $("contactNumber").value =
    data.contact_number || "";

  $("telegramPersonal").value =
    data.telegram_personal || "";

  $("tiktok").value =
    data.tiktok || "";

  $("telegramSocial").value =
    data.telegram_social || "";

  $("instagram").value =
    data.instagram || "";

  $("twitter").value =
    data.twitter || "";

  $("youtube").value =
    data.youtube || "";

  $("facebook").value =
    data.facebook || "";

  $("membersCount").value =
    data.members_count ?? 1000000;

  $("onlineCount").value =
    data.online_count ?? 0;

  $("learningCount").value =
    data.learning_count ?? 0;

  try{
    otherSocial =
      data.other_social
      ? JSON.parse(data.other_social)
      : [];
  }catch{
    otherSocial = [];
  }

  renderOtherSocial();
}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings(){

  status(
    "adminStatus",
    "Saving website settings..."
  );

  let logoUrl = null;
  let profileUrl = null;

  try{

    if($("logoFile").files[0]){
      logoUrl =
        await uploadFile(
          $("logoFile").files[0],
          "logo"
        );
    }

    if($("profileFile").files[0]){
      profileUrl =
        await uploadFile(
          $("profileFile").files[0],
          "profile"
        );
    }

  }catch(error){

    status(
      "adminStatus",
      "Upload failed: " + error.message
    );

    return;
  }


  const {data:existing} =
    await supabaseClient
      .from("site_settings")
      .select("id,logo_url,profile_image_url")
      .limit(1)
      .maybeSingle();


  const payload = {

    site_name:
      $("siteName").value.trim(),

    hero_intro:
      $("heroIntro").value.trim(),

    about_text:
      $("aboutText").value.trim(),

    whatsapp_number:
      $("whatsappNumber").value.trim(),

    contact_number:
      $("contactNumber").value.trim(),

    telegram_personal:
      $("telegramPersonal").value.trim(),

    tiktok:
      $("tiktok").value.trim(),

    telegram_social:
      $("telegramSocial").value.trim(),

    instagram:
      $("instagram").value.trim(),

    twitter:
      $("twitter").value.trim(),

    youtube:
      $("youtube").value.trim(),

    facebook:
      $("facebook").value.trim(),

    other_social:
      JSON.stringify(otherSocial),

    updated_at:
      new Date().toISOString()
  };


  if(logoUrl)
    payload.logo_url = logoUrl;

  if(profileUrl)
    payload.profile_image_url = profileUrl;


  let result;

  if(existing){

    result =
      await supabaseClient
        .from("site_settings")
        .update(payload)
        .eq("id",existing.id);

  }else{

    result =
      await supabaseClient
        .from("site_settings")
        .insert(payload);

  }


  if(result.error){

    status(
      "adminStatus",
      "Save failed: " + result.error.message
    );

    return;
  }

  status(
    "adminStatus",
    "Website settings saved successfully."
  );

  $("logoFile").value = "";
  $("profileFile").value = "";
}


/* =========================
   SAVE CONTACT
========================= */

$("saveContactBtn").onclick =
async ()=>{

  await saveSettings();

};


/* =========================
   SAVE WEBSITE
========================= */

$("saveSettingsBtn").onclick =
async ()=>{

  await saveSettings();

};


/* =========================
   SAVE SOCIAL
========================= */

$("saveSocialBtn").onclick =
async ()=>{

  await saveSettings();

};


/* =========================
   SAVE STATISTICS
========================= */

$("saveStatsBtn").onclick =
async ()=>{

  const {data} =
    await supabaseClient
      .from("site_settings")
      .select("id")
      .limit(1)
      .maybeSingle();

  if(!data){
    status(
      "adminStatus",
      "Website settings record not found."
    );
    return;
  }

  const {error} =
    await supabaseClient
      .from("site_settings")
      .update({

        members_count:
          Number($("membersCount").value) || 0,

        online_count:
          Number($("onlineCount").value) || 0,

        learning_count:
          Number($("learningCount").value) || 0,

        updated_at:
          new Date().toISOString()

      })
      .eq("id",data.id);

  if(error){

    status(
      "adminStatus",
      "Statistics save failed: " + error.message
    );

  }else{

    status(
      "adminStatus",
      "Statistics saved successfully."
    );

  }

};


/* =========================
   OTHER SOCIAL
========================= */

function renderOtherSocial(){

  const box =
    $("otherSocialContainer");

  box.innerHTML = "";

  otherSocial.forEach((item,index)=>{

    const div =
      document.createElement("div");

    div.className = "tutorial";

    div.innerHTML = `

      <label>Platform Name</label>

      <input
        value="${escapeHtml(item.name || "")}"
        oninput="otherSocial[${index}].name=this.value"
      >

      <label>Username / ID</label>

      <input
        value="${escapeHtml(item.username || "")}"
        oninput="otherSocial[${index}].username=this.value"
      >

      <button
        class="danger"
        onclick="removeSocial(${index})"
      >
        Remove
      </button>

    `;

    box.appendChild(div);

  });

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


window.removeSocial = function(index){

  otherSocial.splice(index,1);

  renderOtherSocial();

};


$("addSocialBtn").onclick = ()=>{

  otherSocial.push({
    name:"",
    username:""
  });

  renderOtherSocial();

};


/* =========================
   TUTORIALS
========================= */

$("addTutorialBtn").onclick =
async ()=>{

  const title =
    $("tutorialTitle").value.trim();

  if(!title){

    status(
      "tutorialStatus",
      "Tutorial title is required."
    );

    return;
  }

  status(
    "tutorialStatus",
    "Uploading files..."
  );


  let thumbnailUrl = null;
  let videoUrl = null;

  try{

    if($("thumbnailFile").files[0]){

      thumbnailUrl =
        await uploadFile(
          $("thumbnailFile").files[0],
          "thumbnails"
        );

    }

    if($("videoFile").files[0]){

      videoUrl =
        await uploadFile(
          $("videoFile").files[0],
          "videos"
        );

    }

  }catch(error){

    status(
      "tutorialStatus",
      "File upload failed: " + error.message
    );

    return;
  }


  const {error} =
    await supabaseClient
      .from("tutorials")
      .insert({

        title,

        category:
          $("tutorialCategory").value.trim(),

        description:
          $("tutorialDescription").value.trim(),

        content:
          $("tutorialContent").value.trim(),

        caption:
          $("tutorialCaption").value.trim(),

      });

  });

/* =========================
   LOAD TUTORIALS
========================= */

async function loadTutorials(){

  const {data,error} =
    await supabaseClient
      .from("tutorials")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    $("tutorialList").innerHTML =
      "<p>Could not load tutorials.</p>";

    return;
  }


  const box =
    $("tutorialList");

  box.innerHTML = "";


  if(!data || data.length===0){

    box.innerHTML =
      "<small>No tutorials yet.</small>";

    return;
  }


  data.forEach(t=>{

    const div =
      document.createElement("div");

    div.className =
      "tutorial";

    div.innerHTML = `

      <h3>${escapeHtml(t.title || "")}</h3>

      <small>
        ${escapeHtml(t.category || "")}
      </small>

      <p>
        ${escapeHtml(t.description || "")}
      </p>

      <p>
        Status:
        ${t.published ? "Published" : "Unpublished"}
      </p>

      <button
        onclick="toggleTutorial(${t.id},${!t.published})"
      >
        ${t.published ? "Unpublish" : "Publish"}
      </button>

      <button
        class="danger"
        onclick="deleteTutorial(${t.id})"
      >
        Delete
      </button>

    `;

    box.appendChild(div);

  });

}


window.toggleTutorial =
async function(id,value){

  const {error} =
    await supabaseClient
      .from("tutorials")
      .update({
        published:value,
        updated_at:new Date().toISOString()
      })
      .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  await loadTutorials();

};


window.deleteTutorial =
async function(id){

  if(!confirm("Delete this tutorial?"))
    return;

  const {error} =
    await supabaseClient
      .from("tutorials")
      .delete()
      .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  await loadTutorials();

};

   PLATFORMS

  try{

    if($("platformLogo").files[0]){

          "platforms"

      error.message

  const {error} =

  }


  $("platformName").value="";
  $("platformUsername").value="";
  $("platformWebsite").value="";
  $("platformLogo").value="";

  await loadPlatforms();

};


async function loadPlatforms(){

  const {data,error} =
    await supabaseClient
      .from("platforms")
      .select("*")
      .order("created_at",{ascending:false});


  const box =
    $("platformList");

  box.innerHTML="";


  if(error){

    box.innerHTML =
      "<p>Could not load platforms.</p>";

    return;
  }


  if(!data.length){

    box.innerHTML =
      "<small>No platforms added yet.</small>";

    return;
  }


  data.forEach(p=>{

    const div =
      document.createElement("div");

    div.className="tutorial";

    div.innerHTML = `

      <strong>${escapeHtml(p.name)}</strong>

      <p>
        ${escapeHtml(p.username || "")}
      </p>

      <button
        class="danger"
        onclick="deletePlatform(${p.id})"
      >
        Delete
      </button>

    `;

    box.appendChild(div);

  });

}


window.deletePlatform =
async function(id){

  if(!confirm("Delete this platform?"))
    return;

  const {error} =
    await supabaseClient
      .from("platforms")
      .delete()
      .eq("id",id);

  if(error){

    alert(error.message);

    return;

/* =========================
   FAQ
========================= */

$("addFaqBtn").onclick =
async ()=>{

  const question =
    $("faqQuestion").value.trim();

  const answer =
    $("faqAnswer").value.trim();

  if(!question || !answer){

    alert("Question and answer are required.");

    return;
  }


  const {error} =
    await supabaseClient
      .from("faq")
      .insert({
        question,
        answer,
        published:true
      });


  if(error){

    alert(error.message);

    return;
  }


  $("faqQuestion").value="";
  $("faqAnswer").value="";

  await loadFaq();

};


async function loadFaq(){

  const {data} =
    await supabaseClient
      .from("faq")
      .select("*")
      .order("created_at",{ascending:false});


  const box =
    $("faqList");

  box.innerHTML="";


  (data || []).forEach(item=>{

    const div =
      document.createElement("div");

    div.className="tutorial";

    div.innerHTML = `

      <strong>${escapeHtml(item.question)}</strong>

      <p>${escapeHtml(item.answer)}</p>

      <button
        class="danger"
        onclick="deleteFaq(${item.id})"
      >
        Delete
      </button>

    `;

    box.appendChild(div);

  });

}


window.deleteFaq =
async function(id){

  if(!confirm("Delete this FAQ?"))
    return;

  await supabaseClient
    .from("faq")
    .delete()
    .eq("id",id);

  await loadFaq();

};
